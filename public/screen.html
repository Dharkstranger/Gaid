<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAID screen</title>
<meta name="description" content="GAID, said “guide”. The screen beside the work.">
<meta name="theme-color" content="#F4F4F1">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/screen.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<main class="tv" aria-label="Screen beside the work">
  <figure class="mount">
    <img id="art" alt="">
    <p id="noart" class="noart" hidden data-w="noPicture">No picture</p>
  </figure>

  <section class="side">
    <p id="where" class="where"></p>
    <h1 id="title" class="title" data-w="tvWait">Waiting…</h1>
    <p id="meta" class="meta"></p>
    <div id="panel" class="panel"></div>
  </section>

  <section class="said" aria-live="polite">
    <p id="you" class="you"></p>
    <p id="reply" class="reply"></p>
  </section>

  <footer class="foot">
    <img src="/brand/gaid-wordmark.svg" alt="GAID" width="84" height="28">
    <span id="code" class="code"></span>
  </footer>
</main>
<script type="module" src="/screen.js"></script>
</body>
</html>
