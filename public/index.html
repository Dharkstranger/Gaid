<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAID</title>
<meta name="description" content="GAID, said “guide”. Ask the work in front of you.">
<meta name="theme-color" content="#14204A">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<header class="top wrap">
  <a class="brand" href="/" aria-label="GAID, home"><img src="/brand/gaid-wordmark.svg" alt="" width="103" height="40"></a>
  <p class="tag" data-w="tag">Simulated Alexa+</p>
</header>

<main class="wrap">
  <section class="stage" aria-label="The work">
    <figure class="mount">
      <img id="art" alt="">
      <p id="noart" class="noart" hidden data-w="noPicture">No picture</p>
    </figure>
    <div class="words">
      <p id="where" class="where"></p>
      <h1 id="title" class="title">GAID</h1>
      <p id="meta" class="meta"></p>
      <div class="said" aria-live="polite">
        <p id="you" class="you" hidden></p>
        <p id="reply" class="reply"></p>
        <p id="source" class="source" hidden></p>
      </div>
    </div>
  </section>

  <section class="controls" aria-label="Ask">
    <button id="talk" class="talk" type="button" aria-pressed="false" data-state="idle">
      <span class="voice" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="talkWord" data-w="talk">Talk</span>
    </button>
    <form id="askForm" class="ask">
      <label for="q" class="sr" data-w="question">Question</label>
      <input id="q" name="q" type="text" maxlength="300" autocomplete="off" placeholder="Ask this work">
      <button type="submit" class="go" data-w="ask">Ask</button>
    </form>
    <div id="chips" class="chips" role="group" aria-label="Ask about"></div>
    <div class="row">
      <label id="langWrap" class="lang" hidden><span data-w="language">Language</span>
        <select id="lang"></select>
      </label>
      <label class="pair"><span data-w="screen">Screen</span>
        <input id="room" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="4" placeholder="Code">
      </label>
      <a id="toScreen" class="to-screen" href="/screen.html" target="_blank">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="1"/><path d="M8 21h8M12 17v4"/></svg>
        <span data-w="openScreen">Open screen</span>
      </a>
    </div>
  </section>

  <section class="home-panel" aria-labelledby="homeH">
    <button id="takeHome" class="go take" type="button" aria-expanded="false" aria-controls="homeBox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span id="homeH" data-w="takeHome">Take home</span>
    </button>
    <div id="homeBox" class="home-box" hidden>
      <p class="label" data-w="visitCode">Visit code</p>
      <p id="visitCode" class="visit-code"></p>
      <a id="toHome" class="to-screen" href="/home" data-w="openHome">Open at home</a>
    </div>
  </section>

  <section class="walk" aria-labelledby="walkH">
    <h2 id="walkH" data-w="works">Works</h2>
    <div id="works" class="works"></div>
  </section>

  <p class="foot" data-w="foot">Not an Amazon product</p>
  <audio id="clip" preload="none"></audio>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
